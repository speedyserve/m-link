services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlink}
      POSTGRES_USER: ${POSTGRES_USER:-mlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlink}
    ports:
      - "5432:5432"
    volumes:
      - mlink_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlink} -d ${POSTGRES_DB:-mlink}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mlink_postgres:

